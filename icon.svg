<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Plugin Canvas">
  <title>Plugin Canvas</title>
  <!-- An infinite canvas: a dot grid with two plugin nodes joined by an edge. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1a1a2e"/>
  <g fill="#3a3a5c">
    <circle cx="14" cy="14" r="1.4"/><circle cx="26" cy="14" r="1.4"/><circle cx="38" cy="14" r="1.4"/><circle cx="50" cy="14" r="1.4"/>
    <circle cx="14" cy="26" r="1.4"/><circle cx="26" cy="26" r="1.4"/><circle cx="38" cy="26" r="1.4"/><circle cx="50" cy="26" r="1.4"/>
    <circle cx="14" cy="38" r="1.4"/><circle cx="26" cy="38" r="1.4"/><circle cx="38" cy="38" r="1.4"/><circle cx="50" cy="38" r="1.4"/>
    <circle cx="14" cy="50" r="1.4"/><circle cx="26" cy="50" r="1.4"/><circle cx="38" cy="50" r="1.4"/><circle cx="50" cy="50" r="1.4"/>
  </g>
  <line x1="24" y1="22" x2="44" y2="42" stroke="#4D6BFE" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="8" y="12" width="18" height="14" rx="4" fill="#4D6BFE"/>
  <rect x="11" y="16" width="12" height="3" rx="1.5" fill="#fff"/>
  <rect x="11" y="21" width="8" height="3" rx="1.5" fill="#fff" opacity="0.6"/>
  <rect x="38" y="38" width="18" height="14" rx="4" fill="#049BDF"/>
  <rect x="41" y="42" width="12" height="3" rx="1.5" fill="#fff"/>
  <rect x="41" y="47" width="8" height="3" rx="1.5" fill="#fff" opacity="0.6"/>
</svg>
